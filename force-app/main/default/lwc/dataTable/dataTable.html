<template>
    <div class="custom-box">
        <!-- Header -->
        <div class="slds-p-around_small header-section slds-grid slds-grid_align-spread">
            <div class="header-div slds-grid slds-grid_vertical-align-center">
                <lightning-icon icon-name={headerIcon} alternative-text="Header Icon" size="small"></lightning-icon>
                <div class="slds-m-left_small">
                    <p class="slds-text-title_bold slds-truncate">{headerName}</p>
                    <div class="slds-m-top_x-small slds-grid slds-grid_vertical-align-center">
                        <span class="slds-text-body_regular slds-truncate">{viewName}</span>
                        <div class="slds-dropdown-trigger slds-dropdown-trigger_click slds-m-left_x-small"
                            style="position: relative;">
                            <lightning-icon icon-name="utility:down" size="x-small" class="slds-m-left_x-small"
                                onclick={toggleMenu}></lightning-icon>
                            <lightning-button-icon icon-name={pinnedListViewIcon} alternative-text="Pin/Unpin List View"
                                variant="bare" class="slds-m-left_x-small" onclick={togglePinFromHeader}>
                            </lightning-button-icon>

                            <!-- List View Picker -->
                            <c-list-view-picker show-menu={showMenu} filtered-list-views={filteredListViews}
                                onsearch={handleSearch} onmenuselect={handleMenuSelect}></c-list-view-picker>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="actions-section slds-grid slds-grid_vertical-align-center">
                <lightning-button-group class="slds-m-bottom_small action-buttons">
                    <template for:each={actionButtons} for:item="btn">
                        <lightning-button key={btn} label={btn.label} data-id={btn.name} data-label={btn.label}
                            onclick={handleButtonClick}>
                        </lightning-button>
                    </template>
                </lightning-button-group>

                <div class="slds-m-left_medium slds-grid slds-grid_vertical-align-center">

                    <!-- Search Box -->
                    <lightning-input if:false={hideSearch} type="search" variant="label-hidden"
                        placeholder="Search this list..." onchange={handleSearchRecords} class="search-input">
                    </lightning-input>

                    <!--  Gear Icon -->
                    <lightning-button-icon icon-name="utility:setup" variant="border-filled"
                        alternative-text="List View Controls" class="slds-m-left_small" onclick={handleMenuToggleGear}>
                    </lightning-button-icon>

                    <!-- Filter Icon -->
                    <lightning-button-icon icon-name="utility:filterList" alternative-text="Filter"
                        variant="border-filled" class="slds-m-left_small" onclick={handleFilterClick}>
                    </lightning-button-icon>

                    <!-- Refresh Icon (Now next to Gear + Filter, right-side) -->
                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh"
                        variant="border-filled" class="slds-m-left_small" title="Refresh this list"
                        onclick={handleRefresh}>
                    </lightning-button-icon>

                </div>
            </div>
        </div>

        <!-- Screen Flow Modal -->
        <template if:true={showFlowScreen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close"
                                size="small"></lightning-icon>
                        </button>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <div style="display: flex;align-item: center;justify-content:center;">
                            <lightning-flow flow-api-name={actiontarget} onstatuschange={handleStatusChange}>
                            </lightning-flow>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Gear Dropdown -->
        <template if:true={showGearMenu}>
            <div class="slds-dropdown slds-dropdown_small slds-m-left_x-small" role="menu">
                <ul class="slds-dropdown__list" role="presentation">
                    <li class="slds-dropdown__item" role="presentation">
                        <a role="menuitem" tabindex="0" onclick={handleNewListView}><span
                                class="slds-truncate">New</span></a>
                    </li>
                    <li class="slds-dropdown__item" role="presentation">
                        <a role="menuitem" tabindex="0" onclick={handleDelete}><span
                                class="slds-truncate">Delete</span></a>
                    </li>
                    <li class="slds-dropdown__item" role="presentation">
                        <a role="menuitem" tabindex="0" onclick={handleAddFields}><span class="slds-truncate">Select
                                Fields to Display</span></a>
                    </li>
                    <li class="slds-dropdown__item" role="presentation">
                        <a role="menuitem" tabindex="0" onclick={handleRefresh}><span
                                class="slds-truncate">Refresh</span></a>
                    </li>
                </ul>
            </div>
        </template>

        <!-- DataTable -->
        <div class="slds-grid slds-wrap slds-m-top_small" id="table-container">
            <div class={datatableClass}>
                <lightning-datatable key-field="!id" data={paginatedData} columns={columns} show-row-number-column
                    draft-values={draftValues} onsave={handleSave} oncancel={handleCancelInlineEdits}
                    onrowaction={handleRowAction} onrowselection={handleRowSelection}
                    onheaderaction={handleHeaderAction} sorted-by={sortedBy} sorted-direction={sortedDirection}
                    onsort={handleSort}>
                </lightning-datatable>

                <!-- <template if:true={isEmpty}>
                    <div class="slds-p-around_medium">
                        <c-data-table-illustration display-msg={tableEmptyMessage}></c-data-table-illustration>
                    </div>
                </template>-->
            </div>

            <!-- Filter Panel -->
            <template if:true={showFilterPanel}>
                <div class="slds-m-left_xx-small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-around_small slds-m-top_medium body-header"
                        style="background:aliceblue">
                        <div class="slds-truncate head-text-style">Filter</div>
                        <section class="slds-grid slds-grid_align-end edit-filter">
                            <lightning-button variant="brand-outline" class="slds-m-top_x-small" label='Add'
                                icon-name="utility:add" icon-position="right" onclick={handleEditFilter}>
                            </lightning-button>
                        </section>
                    </div>

                    <div class="slds-p-horizontal_small slds-p-bottom_small filterDiv">
                        <c-filter-list if:true={showFilterPanel} filter-list={allFilterCondition}
                            onupdatefilter={handleUpdateFilters} oneditfilter={handleEditFilters}></c-filter-list>
                        <div class="slds-form-element">
                            <label class="slds-form-element__label textareaHeader" for="textarea-id-01">Logic</label>
                            <div class="slds-form-element__control filter-section">
                                <lightning-textarea id="textarea-id-01" onchange={handleActionCondition}
                                    value={filterLogic}></lightning-textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <template lwc:if={showJsonToDataMapper}>
                    <c-json-to-data-mapper enable-insert-button={showJsonToDataMapper} onclose={handelClose}
                        oninsert={getFilterValue}>
                    </c-json-to-data-mapper>
                </template>
            </template>
        </div>

        <!-- Pagination Footer -->
        <div class="pagination-footer slds-p-around_medium slds-grid slds-grid_align-spread">
            <div class="slds-text-title_bold">Total {totalEntries}</div>

            <div class="pagination-div slds-grid slds-grid_vertical-align-center">
                <label for="pageSize">Lines in the list:</label>
                <lightning-combobox name="pageSize" variant="label-hidden" value={pageSize} options={pageSizeOptions}
                    onchange={handlePageSizeChange} class="slds-m-left_x-small"></lightning-combobox>

                <label for="jumpTo" class="slds-m-left_medium">Jump To:</label>
                <lightning-combobox name="jumpTo" variant="label-hidden" value={currentPage} options={pageOptions}
                    onchange={handlePageChange} class="slds-m-left_x-small"></lightning-combobox>

                <lightning-button-icon icon-name="utility:chevronleft" onclick={handlePrevious}
                    disabled={disablePrevious} class="slds-m-left_medium"></lightning-button-icon>
                <lightning-button-icon icon-name="utility:chevronright" onclick={handleNext} disabled={disableNext}
                    class="slds-m-left_x-small"></lightning-button-icon>

                <span class="slds-badge slds-theme_info slds-m-left_small">{currentPage}</span>
            </div>
        </div>

        <!-- Dynamic edit Modal -->
        <template if:true={showDynamicModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-width">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" title="Close"
                            onclick={handleDynamicCancel}>
                            <lightning-icon icon-name="utility:close" variant="inverse" size="x-small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">Edit {editObjectName}</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={dynamicFormFields}>

    <template for:each={dynamicFormFields} for:item="f">
        <div key={f.name} class="slds-m-bottom_small">

            <lightning-input
                label={f.label}
                name={f.name}
                data-name={f.name}
                value={f.value}
                type="text"
                disabled={f.readOnly}
                onchange={handleEditFieldChange}>
            </lightning-input>

        </div>
    </template>

</template>

                        <template if:false={dynamicFormFields}>
                            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                        </template>
                    </div>

                    <footer class="slds-modal__footer" style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                        <lightning-button variant="neutral" label="Cancel"
                            onclick={handleDynamicCancel}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={handleDynamicSave}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>

    <!-- Add Field Modal -->
    <template if:true={addFieldModal}>
        <c-add-field-modal onclosemodal={closeAddFieldModal} onsaveselection={handleFieldSelection}
            column-data={tableDataHeaders} select-list-view-id={selectedListViewId}>
        </c-add-field-modal>
    </template>

    <!-- Delete Confirmation Modal -->
    <template if:true={showDeleteConfirm}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-width">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close"
                        onclick={cancelDeleteRecord}>
                        <lightning-icon icon-name="utility:close" variant="inverse" size="x-small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">
                        Delete {editObjectName}
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <p>Are you sure you want to delete this record?</p>
                    <template if:true={recordToDelete}>
                        <p class="slds-m-top_small"><strong>{recordToDelete.Name}</strong></p>
                    </template>
                </div>

                <footer class="slds-modal__footer" style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                    <lightning-button variant="neutral" label="Cancel" onclick={cancelDeleteRecord}></lightning-button>
                    <lightning-button variant="destructive" label="Delete"
                        onclick={confirmDeleteRecord}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- </div> -->
    <!-- Assign Owner Modal -->
    <template if:true={showAssignOwnerModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close"
                        onclick={closeAssignOwnerModal}>
                        <lightning-icon icon-name="utility:close" variant="inverse" size="x-small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Assign Owner</h2>
                </header>

                <!-- Content -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox name="owner" label="Select New Owner" placeholder="Choose a user"
                        options={userOptions} value={selectedOwnerId} onchange={handleOwnerChange}>
                    </lightning-combobox>
                </div>

                <!-- Footer with spacing -->
                <footer class="slds-modal__footer" style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeAssignOwnerModal}>
                    </lightning-button>
                    <lightning-button variant="brand" label="Assign" onclick={assignOwnerToRecord}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- Send Email Modal -->
<template if:true={showSendEmailModal}>
    <section class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- Header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close"
                    onclick={closeSendEmailModal}>
                    <lightning-icon icon-name="utility:close" variant="inverse" size="x-small"></lightning-icon>
                </button>
                <h2 class="slds-text-heading_medium">Send Email</h2>
                <p class="slds-m-top_x-small slds-text-body_small">
                    Recipients:
                    <template for:each={emailRecipients} for:item="addr">
                        <span key={addr} class="slds-badge slds-m-right_x-small">{addr}</span>
                    </template>
                </p>
            </header>

            <!-- Content -->
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input
                    type="text"
                    label="Subject"
                    value={emailSubject}
                    onchange={handleEmailSubjectChange}>
                </lightning-input>

                <lightning-textarea
                    class="slds-m-top_medium"
                    label="Body"
                    value={emailBody}
                    onchange={handleEmailBodyChange}>
                </lightning-textarea>
            </div>

            <!-- Footer -->
            <footer class="slds-modal__footer" style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <lightning-button variant="neutral" label="Cancel" onclick={closeSendEmailModal}></lightning-button>
                <lightning-button variant="brand" label="Send" onclick={sendEmailNow}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

</template>
